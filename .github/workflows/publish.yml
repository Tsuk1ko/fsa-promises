name: Publish

on:
  push:
    branches:
      - "!*"
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: bun install
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Publish
        run: npm publish
      - name: Changelog
        uses: ardalanamini/auto-changelog@v4
        id: changelog
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
